<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동물 부부 귀요미판</title>
<style>:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#e4e2dc;--acc:#b8860b}
@media (prefers-color-scheme:dark){:root{--bg:#151513;--fg:#ecebe6;--mut:#a3a29c;--card:#1f1f1c;--line:#33322e;--acc:#e3b341}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Apple SD Gothic Neo",sans-serif}main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}p{color:var(--mut)}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}h2{font-size:16px;margin:0 0 8px;color:var(--acc)}video{width:100%;border-radius:10px;background:#000}</style></head>
<body><main><h1>동물 부부 썰 — 귀요미판</h1><p>같은 대본·목소리로 캐릭터만 «실사 귀요미»(남편 2 · 아내 2)로 바꿔 다시 만들었습니다. 17초 · 업로드 안 함.</p>
<div class="g"><section><h2>🆕 귀요미판</h2><video controls playsinline preload="metadata" src="cute.mp4"></video></section>
<section><h2>지금판(성인 체형)</h2><video controls playsinline preload="metadata" src="real.mp4"></video></section></div></main><div style="max-width:820px;margin:48px auto 24px;padding:12px 16px;border-top:1px solid rgba(128,128,128,.28);font:13px/1.6 -apple-system,'Apple SD Gothic Neo',sans-serif;color:#8a8a8a;">주소를 아는 사람은 열람할 수 있는 페이지입니다 · 2026-10-31 이후 자동 삭제</div>
</body></html>
