<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>국밥집·동물병원 세트</title>
<style>
:root{--bg:#fafaf8;--fg:#1a1a1a;--muted:#666;--card:#fff;--line:#e5e3dd}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#eee;--muted:#aaa;--card:#1f1f1f;--line:#333}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Apple SD Gothic Neo",sans-serif}
main{max-width:760px;margin:auto;padding:16px}h1{font-size:22px;margin:8px 0}h2{font-size:18px;margin:22px 0 8px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>figure{flex:1 1 300px;min-width:0;margin:0}
img{width:100%;border-radius:12px;display:block}figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
</style></head><body><main>
<h1>A·C 편 빈 세트 확인</h1>
<div class="card">새 장소는 빈 세트 확인 뒤에만 키프레임으로 갑니다(09-25 규칙). B(식당 계산대)는 승인된 «고깃집 계산대» 세트로 먼저 제작합니다.</div>
<div class="row">
<figure><img src="gukbap.png" alt="국밥집"><figcaption><b>A. 동네 국밥집</b> — 벽 쪽 4인 테이블 두 개(앞은 빈 자리 = 도윤이네 자리, 뒤는 뚝배기 한 그릇 = 혼자 드시는 할아버지 자리), 뒤 주방. 글자·로고 없음.</figcaption></figure>
<figure><img src="vet.png" alt="동물병원 진료실"><figcaption><b>C. 동네 동물병원 진료실</b> — 가운데 스테인리스 진료대(하늘색 매트, 어른 허리 높이 = 콩이 자리), 건너편 수의사 자리, 앞 엄마·도윤이 자리. 글자·로고 없음.</figcaption></figure>
</div>
</main><div style="max-width:820px;margin:48px auto 24px;padding:12px 16px;border-top:1px solid rgba(128,128,128,.28);font:13px/1.6 -apple-system,'Apple SD Gothic Neo',sans-serif;color:#8a8a8a;">주소를 아는 사람은 열람할 수 있는 페이지입니다 · 2026-11-22 이후 자동 삭제</div>
</body></html>
